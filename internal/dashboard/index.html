<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>raftkv dashboard</title>
<link rel="icon" href="data:,">
<style nonce="{{NONCE}}">
:root {
  color-scheme: light dark;
  --bg: #f6f7f9; --fg: #1b1f24; --muted: #667085; --card: #ffffff; --line: #e3e6ea;
  --ok: #1a7f4b; --warn: #b7791f; --bad: #c0392b; --leader: #2563eb; --track: #e9ecf0;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1318; --fg: #e6e9ee; --muted: #8b95a5; --card: #171c23; --line: #262d36;
    --ok: #3fb97a; --warn: #e0a63a; --bad: #ef6a5b; --leader: #6b9bff; --track: #262d36;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
.top { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; padding: 16px 24px; border-bottom: 1px solid var(--line); }
h1 { margin: 0; font-size: 20px; }
h1 span { color: var(--muted); font-weight: 400; }
h2 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 24px 0 8px; }
main { max-width: 1100px; margin: 0 auto; padding: 8px 24px 40px; }
.pills { display: flex; gap: 8px; }
.pill, .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid currentColor; }
.ok { color: var(--ok); } .warn { color: var(--warn); } .bad, .down { color: var(--bad); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 20px; }
.stats div { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
.k { display: block; color: var(--muted); font-size: 12px; }
.big { font-size: 18px; font-weight: 650; word-break: break-all; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin-top: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-top: 4px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.card.leader { border-top-color: var(--leader); }
.card.follower { border-top-color: var(--ok); }
.card.candidate, .card.stale { border-top-color: var(--warn); }
.card.down { border-top-color: var(--bad); opacity: .75; }
.card header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card h2 { margin: 0; font-size: 15px; text-transform: none; letter-spacing: 0; color: var(--fg); word-break: break-all; }
.badge.leader { color: var(--leader); } .badge.follower { color: var(--ok); }
.badge.candidate, .badge.stale { color: var(--warn); } .badge.unknown { color: var(--muted); }
.target { color: var(--muted); font-size: 12px; margin: 2px 0 10px; word-break: break-all; }
.bar { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; }
.fill { height: 100%; background: var(--leader); }
.barlabel { color: var(--muted); font-size: 12px; margin: 4px 0 8px; }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 2px 0; border-top: 1px solid var(--line); }
.kv .k { display: inline; } .kv .v { font-variant-numeric: tabular-nums; text-align: right; word-break: break-all; }
.err { color: var(--bad); font-size: 13px; margin: 6px 0 0; word-break: break-word; }
.events { list-style: none; margin: 0; padding: 0; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
.events li { display: flex; gap: 12px; padding: 6px 14px; border-top: 1px solid var(--line); }
.events li:first-child { border-top: 0; }
.events time { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.ev.down, .ev.warn { color: var(--bad); } .ev.up { color: var(--ok); } .ev.leader { color: var(--leader); font-weight: 600; }
.empty { color: var(--muted); padding: 10px 14px; }
</style>
</head>
<body>
<header class="top">
  <h1>raftkv <span>cluster</span></h1>
  <div class="pills">
    <span id="conn" class="pill warn">connecting…</span>
    <span id="health" class="pill warn">…</span>
  </div>
</header>
<main>
  <section class="stats">
    <div><span class="k">Leader</span><span id="leader" class="big">—</span></div>
    <div><span class="k">Term</span><span id="term" class="big">—</span></div>
    <div><span class="k">Nodes reachable</span><span id="reach" class="big">—</span></div>
    <div><span class="k">Updated</span><span id="updated" class="big">—</span></div>
  </section>
  <section id="nodes" class="grid" aria-live="polite"></section>
  <h2>Events</h2>
  <ol id="events" class="events"></ol>
</main>
<script nonce="{{NONCE}}">
(function () {
  'use strict';
  var ROLES = ['leader', 'follower', 'candidate'];
  var lastMessage = 0;

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) { e.className = cls; }
    if (text !== undefined) { e.textContent = text; }
    return e;
  }
  function pill(node, cls, text) { node.className = 'pill ' + cls; node.textContent = text; }
  function clock(s) { var d = new Date(s); return isNaN(d) ? '' : d.toLocaleTimeString(); }
  function row(parent, k, v) {
    var r = el('div', 'kv');
    r.appendChild(el('span', 'k', k));
    r.appendChild(el('span', 'v', String(v)));
    parent.appendChild(r);
  }

  function nodeCard(n) {
    var role = !n.reachable ? 'down' : n.stale ? 'stale' : (ROLES.indexOf(n.state) >= 0 ? n.state : 'unknown');
    var text = role === 'down' ? 'unreachable' : role === 'stale' ? 'stale leader' : role === 'unknown' ? 'unknown' : n.state;

    var card = el('article', 'card ' + role);
    var head = el('header');
    head.appendChild(el('h2', null, n.id || n.target));
    head.appendChild(el('span', 'badge ' + role, text));
    card.appendChild(head);
    card.appendChild(el('div', 'target', n.target));

    if (!n.reachable) {
      card.appendChild(el('p', 'err', n.error || 'unreachable'));
      return card;
    }
    var pct = n.last_index > 0 ? Math.min(100, n.commit_index / n.last_index * 100) : 100;
    var bar = el('div', 'bar');
    var fill = el('div', 'fill');
    fill.style.width = pct + '%';
    bar.appendChild(fill);
    card.appendChild(bar);
    card.appendChild(el('div', 'barlabel', 'commit ' + n.commit_index + ' of ' + n.last_index + ' log entries'));

    row(card, 'term', n.term);
    row(card, 'thinks leader is', n.leader || '—');
    row(card, 'applied', n.applied_index);
    row(card, 'snapshot at', n.snapshot_index || 'none');
    row(card, 'ready', n.ready ? 'yes' : 'no');
    row(card, 'poll latency', n.latency_ms.toFixed(1) + ' ms');
    if (n.node_error) { card.appendChild(el('p', 'err', n.node_error)); }
    return card;
  }

  function render(s) {
    var sum = s.summary;
    if (sum.healthy) { pill($('health'), 'ok', 'Healthy'); }
    else if (sum.quorum) { pill($('health'), 'warn', 'No leader'); }
    else { pill($('health'), 'bad', 'No quorum'); }

    $('leader').textContent = sum.leader || '—';
    $('term').textContent = sum.term;
    $('reach').textContent = sum.reachable + ' / ' + sum.total;
    $('updated').textContent = clock(s.time);

    var grid = $('nodes');
    grid.replaceChildren();
    (s.nodes || []).forEach(function (n) { grid.appendChild(nodeCard(n)); });

    var list = $('events');
    list.replaceChildren();
    var events = s.events || [];
    if (events.length === 0) { list.appendChild(el('li', 'empty', 'Nothing yet.')); }
    events.forEach(function (e) {
      var li = el('li');
      li.appendChild(el('time', null, clock(e.time)));
      var kind = /^[a-z]+$/.test(e.kind) ? e.kind : 'info';
      li.appendChild(el('span', 'ev ' + kind, e.message));
      list.appendChild(li);
    });
  }

  var es = new EventSource('events');
  es.onopen = function () { pill($('conn'), 'ok', 'live'); };
  es.onmessage = function (e) {
    try {
      render(JSON.parse(e.data));
      lastMessage = Date.now();
      pill($('conn'), 'ok', 'live');
    } catch (err) {
      pill($('conn'), 'bad', 'bad data');
    }
  };
  es.onerror = function () { pill($('conn'), 'warn', 'reconnecting…'); };
  setInterval(function () {
    if (lastMessage && Date.now() - lastMessage > 5000) { pill($('conn'), 'warn', 'stalled'); }
  }, 2000);
})();
</script>
</body>
</html>
